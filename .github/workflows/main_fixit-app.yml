name: Build and deploy Python app to Azure Web App - fixit-app

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create and start virtual environment
        run: |
          python -m venv venv
          source venv/bin/activate

      - name: Install dependencies
        run: |
          source venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !venv/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_01495B82C74644F2A50C285F07D42388 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_E8EBF6EAAAF94610ACC12D4C58D9E8BD }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_328CE1B6927E41CE9E3ABD395DFED159 }}

      - name: Resolve App Service resource group
        id: resolve-rg
        shell: bash
        run: |
          RG=$(az webapp list --query "[?name=='fixit-app'].resourceGroup | [0]" -o tsv)
          if [ -z "$RG" ]; then
            echo "Unable to resolve resource group for App Service 'fixit-app'."
            exit 1
          fi
          echo "resource_group=$RG" >> "$GITHUB_OUTPUT"

      - name: Restart App Service before deploy
        shell: bash
        run: |
          az webapp restart \
            --name fixit-app \
            --resource-group "${{ steps.resolve-rg.outputs.resource_group }}"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'fixit-app'
          slot-name: 'Production'
